<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f4f0e8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ανεργία Core" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<title>Ανεργία Core</title>
<style>
:root{--bg:#fff7ef;--ink:#0d0d0d;--paper:#fffdf8;--yellow:#ffd400;--pink:#ff5fb2;--blue:#4eb3ff;--green:#87f56f;--orange:#ff8a3d;--purple:#9e7bff;--red:#ff5a5a;--border:4px solid #0d0d0d;--shadow:6px 6px 0 #0d0d0d;--radius:24px;--safe-bottom:max(16px, env(safe-area-inset-bottom));--safe-top:max(16px, env(safe-area-inset-top));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--yellow);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;background:radial-gradient(circle at 0 0, rgba(255,255,255,.5), transparent 20%),radial-gradient(circle at 100% 20%, rgba(255,255,255,.4), transparent 18%),linear-gradient(135deg, #ffd400 0%, #ffd400 42%, #ffef86 42%, #ffef86 58%, #ffd400 58%, #ffd400 100%);}
button,input{font:inherit} button{cursor:pointer} input{appearance:none}
.app{min-height:100dvh;display:flex;flex-direction:column;width:100%;max-width:100%;padding:var(--safe-top) clamp(12px,3vw,26px) var(--safe-bottom);}
.inner{width:min(100%, 980px);margin:0 auto;display:flex;flex-direction:column;flex:1;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
.lang-wrap,.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang,.sound-btn,.install-btn{border:var(--border);background:#fff;border-radius:999px;box-shadow:4px 4px 0 #0d0d0d;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.lang{padding:10px 14px;font-size:12px}
.lang.active{background:var(--ink);color:#fff}
.sound-btn,.install-btn{padding:10px 14px;font-size:12px;min-height:44px}
.install-btn.hidden{display:none}
main{flex:1;display:flex;flex-direction:column}
.screen{display:none;animation:pop .18s ease-out} .screen.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.panel{border:var(--border);border-radius:32px;background:var(--paper);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}
.panel:after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;background:var(--blue);border:var(--border);border-radius:50%;transform:rotate(12deg)}
.hero{display:grid;gap:14px}
.hero-title{font-size:clamp(52px,14vw,118px);line-height:.86;letter-spacing:-.07em;text-transform:uppercase;font-weight:1000;margin:0;position:relative;z-index:1}
.kicker{display:inline-block;align-self:start;border:var(--border);background:var(--green);padding:8px 12px;border-radius:999px;box-shadow:4px 4px 0 #0d0d0d;font-size:12px;font-weight:900;text-transform:uppercase;position:relative;z-index:1}
.tagline{font-size:clamp(16px,3.8vw,22px);font-weight:800;line-height:1.1;max-width:26ch;margin:0;position:relative;z-index:1}
.sticker-row{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
.sticker{display:inline-flex;align-items:center;gap:8px;border:var(--border);border-radius:16px;padding:10px 12px;background:var(--pink);box-shadow:4px 4px 0 #0d0d0d;font-weight:900;text-transform:uppercase;font-size:12px}
.sticker.alt{background:var(--blue)} .sticker.alt2{background:#fff}
.section-label{margin:16px 0 10px;font-size:14px;font-weight:1000;text-transform:uppercase;letter-spacing:.03em}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.role{min-height:170px;border:var(--border);border-radius:28px;padding:18px;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column;justify-content:space-between}
.role:nth-child(1){background:var(--pink)} .role:nth-child(2){background:var(--blue)} .role.selected{outline:6px solid #fff;transform:translate(-2px,-2px)}
.role strong{display:block;font-size:clamp(28px,6vw,40px);line-height:.9;letter-spacing:-.05em;text-transform:uppercase} .role .desc{font-size:15px;font-weight:800;line-height:1.08;max-width:15ch} .role .emoji{position:absolute;right:14px;bottom:8px;font-size:40px}
.menu-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.big-btn{min-height:86px;border:var(--border);border-radius:28px;box-shadow:var(--shadow);font-size:clamp(22px,5vw,30px);font-weight:1000;text-transform:uppercase;letter-spacing:-.04em;line-height:.95;padding:12px 14px;background:#fff}
.big-btn.primary{background:var(--ink);color:#fff} .big-btn.secondary{background:var(--orange)}
.pass-card{min-height:72dvh;display:grid;place-items:center;text-align:center} .pass-inner{display:grid;gap:18px;justify-items:center}
.turn-badge{border:var(--border);border-radius:999px;background:var(--green);padding:10px 16px;box-shadow:4px 4px 0 #0d0d0d;font-weight:1000;text-transform:uppercase}
.turn-title{font-size:clamp(40px,10vw,82px);line-height:.9;letter-spacing:-.06em;text-transform:uppercase;font-weight:1000;margin:0;max-width:9ch} .turn-sub{font-size:18px;font-weight:800;max-width:20ch;margin:0} .enter-btn{width:min(100%,320px);min-height:88px;border:var(--border);border-radius:28px;box-shadow:var(--shadow);background:var(--pink);font-size:clamp(22px,5vw,30px);font-weight:1000;text-transform:uppercase;line-height:.95}
.screen-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px} .screen-title{font-size:clamp(32px,8vw,56px);line-height:.9;letter-spacing:-.05em;text-transform:uppercase;font-weight:1000;margin:0} .screen-note{display:inline-flex;align-items:center;gap:8px;border:var(--border);border-radius:16px;background:var(--green);padding:8px 12px;box-shadow:4px 4px 0 #0d0d0d;font-size:12px;font-weight:1000;text-transform:uppercase;white-space:nowrap}
.job-banner{border:var(--border);border-radius:24px;padding:14px 16px;background:#fff;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;margin-bottom:14px;font-weight:900;font-size:18px;line-height:1.05} .job-banner .icon{font-size:26px} .job-banner small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch} .card{position:relative;border:var(--border);border-radius:26px;box-shadow:var(--shadow);background:#fff;padding:16px;min-height:180px;overflow:hidden;display:flex;flex-direction:column} .card:before{content:"";position:absolute;inset:auto 14px 14px auto;width:54px;height:54px;border:var(--border);border-radius:50%;background:var(--accent,var(--orange));opacity:.18} .card .cat{font-size:12px;font-weight:1000;text-transform:uppercase;line-height:1;margin-bottom:10px;color:#333} .card .trait{font-size:clamp(24px,5vw,36px);font-weight:1000;line-height:.9;letter-spacing:-.05em;text-transform:uppercase;margin-bottom:12px} .card .q{font-size:18px;font-weight:800;line-height:1.08;max-width:22ch} .lock-badge{position:absolute;right:12px;top:12px;border:var(--border);border-radius:999px;background:var(--yellow);padding:6px 10px;font-size:11px;font-weight:1000;text-transform:uppercase}
.actions{position:sticky;bottom:0;padding-top:18px;margin-top:4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;background:linear-gradient(transparent, rgba(255,212,0,0.75) 30%, rgba(255,212,0,1) 70%)} .action{min-height:72px;border:var(--border);border-radius:999px;box-shadow:var(--shadow);background:#fff;font-size:18px;font-weight:1000;text-transform:uppercase;letter-spacing:-.03em} .action.primary{background:var(--ink);color:#fff}
.jobs-shell{border:var(--border);border-radius:30px;background:#fff;box-shadow:var(--shadow);padding:16px} .search{width:100%;min-height:58px;border:var(--border);border-radius:999px;box-shadow:4px 4px 0 #0d0d0d;background:#fff;padding:12px 18px;font-size:18px;font-weight:800;margin-bottom:12px} .search::placeholder{color:#666} .filter-row{display:flex;gap:10px;overflow:auto;padding:2px 2px 12px;scrollbar-width:none} .filter-row::-webkit-scrollbar{display:none} .filter-chip{flex:0 0 auto;border:var(--border);border-radius:999px;box-shadow:4px 4px 0 #0d0d0d;background:#fff;padding:10px 14px;font-size:12px;font-weight:1000;text-transform:uppercase} .filter-chip.active{background:var(--ink);color:#fff}
.jobs-topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap} .vacancy-count{font-size:13px;font-weight:1000;text-transform:uppercase} .job-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-height:56dvh;overflow:auto;padding:2px 2px 8px} .job{--jaccent:var(--orange);border:var(--border);border-radius:24px;box-shadow:var(--shadow);background:#fff;padding:14px;text-align:left;position:relative;overflow:hidden;min-height:138px;display:flex;flex-direction:column;justify-content:space-between} .job:before{content:"";position:absolute;right:-8px;top:-8px;width:58px;height:58px;border:var(--border);border-radius:50%;background:var(--jaccent);opacity:.28} .job-code{display:inline-block;align-self:flex-start;border:3px solid #0d0d0d;border-radius:999px;background:var(--jaccent);padding:5px 8px;font-size:10px;font-weight:1000;text-transform:uppercase;margin-bottom:8px} .job .jcat{font-size:12px;font-weight:1000;text-transform:uppercase;line-height:1.05;margin-bottom:8px} .job strong{font-size:22px;font-weight:1000;line-height:.95;letter-spacing:-.03em;display:block;max-width:12ch}
.locked-panel{border:var(--border);border-radius:32px;background:var(--blue);box-shadow:var(--shadow);padding:24px;display:grid;gap:14px;text-align:center} .locked-panel .big{font-size:clamp(34px,8vw,64px);font-weight:1000;line-height:.9;letter-spacing:-.05em;text-transform:uppercase} .note{font-size:16px;font-weight:800;line-height:1.1;max-width:34ch;margin:0 auto}
.footer{margin-top:16px;font-size:12px;font-weight:900;text-transform:uppercase;text-align:center;padding-bottom:8px} .install-hint{margin-top:10px;border:var(--border);border-radius:20px;box-shadow:var(--shadow);background:#fff;padding:12px 14px;font-size:14px;font-weight:800;display:none} .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(30px);background:#0d0d0d;color:#fff;border:var(--border);border-radius:999px;padding:12px 16px;font-size:14px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:min(92vw,480px);text-align:center} .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.qr-home-btn{grid-column:1/-1;min-height:74px;border:var(--border);border-radius:24px;box-shadow:var(--shadow);background:var(--green);font-size:clamp(18px,4.5vw,25px);font-weight:1000;text-transform:uppercase;letter-spacing:-.03em;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:10px}
.qr-home-btn .qr-icon{font-size:28px;line-height:1}
.qr-modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:rgba(13,13,13,.82);backdrop-filter:blur(3px)}
.qr-modal.open{display:grid}
.qr-sheet{width:min(100%,520px);border:var(--border);border-radius:32px;background:var(--yellow);box-shadow:10px 10px 0 #000;padding:18px;display:grid;gap:14px;text-align:center}
.qr-sheet h2{font-size:clamp(34px,9vw,58px);line-height:.88;letter-spacing:-.055em;text-transform:uppercase;margin:0;font-weight:1000}
.qr-frame{border:var(--border);border-radius:26px;background:#fff;box-shadow:var(--shadow);padding:14px;display:grid;place-items:center;aspect-ratio:1/1;width:min(100%,360px);margin:0 auto}
.qr-frame img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.qr-url{border:var(--border);border-radius:18px;background:#fff;padding:10px 12px;font-size:13px;font-weight:900;overflow-wrap:anywhere;box-shadow:4px 4px 0 #000}
.qr-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qr-actions button{min-height:58px;border:var(--border);border-radius:999px;box-shadow:4px 4px 0 #000;background:#fff;font-weight:1000;text-transform:uppercase;font-size:14px}
.qr-actions .primary{background:var(--ink);color:#fff}

@media (max-width:740px){.app{padding-inline:12px} .topbar{align-items:flex-start;flex-direction:column} .top-actions{width:100%;justify-content:space-between} .role-grid,.cards,.job-list,.menu-actions,.actions{grid-template-columns:1fr} .role{min-height:140px} .job{min-height:126px} .job strong{font-size:20px} .panel,.jobs-shell,.locked-panel{padding:14px} .screen-head{flex-direction:column;align-items:flex-start} .screen-note{font-size:11px} .search{font-size:16px;min-height:54px} .card{min-height:156px} .card .q{font-size:16px} .action{min-height:64px} }
@media (min-width:741px){.hero-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start} .menu-side{display:grid;gap:14px} .job-list{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* CALMER NEO-BRUTALIST MOBILE PASS */
:root{
  --bg:#f4f0e8;
  --paper:#fffdfa;
  --ink:#111111;
  --yellow:#f1d44c;
  --pink:#ef8fbd;
  --blue:#9ecae8;
  --green:#afd8a6;
  --orange:#efaa6c;
  --purple:#b9a9df;
  --red:#e88b83;
  --border:3px solid #111;
  --shadow:4px 4px 0 #111;
}
html,body{background:var(--bg)!important;color:#111!important;overflow-x:hidden}
body{background:var(--bg)!important}
body *{color:#111}
.lang.active,.big-btn.primary,.action.primary,.filter-chip.active{color:#fff!important;background:#111!important}
.panel,.jobs-shell,.locked-panel,.role,.job,.card,.job-banner,.search,.qr-sheet,.qr-frame,.qr-url{background:var(--paper)}
.panel:after{background:var(--orange);opacity:.55}
.kicker{background:var(--green)}
.sticker{background:var(--pink)}
.sticker.alt{background:var(--orange)}
.sticker.alt2{background:#fff}
.role:nth-child(1){background:#f7d8e7}
.role:nth-child(2){background:#dbeaf3}
.big-btn.secondary{background:#f4c99f}
.enter-btn{background:#f2c5da}
.turn-badge,.screen-note{background:#d6e7cc}
.locked-panel{background:#e2edf4}
.qr-sheet{background:#f4f0e8}
.qr-home-btn{background:#d6e7cc;color:#111}
.job-code{color:#111!important}

/* shrink the chrome and give the content the screen */
.app{padding:max(8px,env(safe-area-inset-top)) clamp(9px,2.5vw,18px) max(8px,env(safe-area-inset-bottom))}
.inner{width:min(100%,920px)}
.topbar{margin-bottom:8px;gap:7px}
.lang-wrap,.top-actions{gap:7px}
.lang,.sound-btn,.install-btn{min-height:36px;padding:7px 10px;font-size:10px;box-shadow:3px 3px 0 #111}
.panel{padding:14px;border-radius:24px}
.hero{gap:10px}
.hero-title{font-size:clamp(42px,11vw,82px);line-height:.88}
.kicker{padding:6px 9px;font-size:10px;box-shadow:3px 3px 0 #111}
.tagline{font-size:clamp(13px,3vw,17px);max-width:31ch}
.sticker-row{gap:7px}.sticker{padding:7px 9px;font-size:10px;box-shadow:3px 3px 0 #111}
.section-label{margin:11px 0 7px;font-size:12px}
.role-grid{gap:9px}.role{min-height:118px;padding:13px;border-radius:20px}
.role strong{font-size:clamp(21px,5vw,30px)}.role .desc{font-size:12px;max-width:17ch}.role .emoji{font-size:30px}
.menu-actions{gap:9px;margin-top:10px}.big-btn{min-height:66px;border-radius:20px;font-size:clamp(17px,4.4vw,23px);box-shadow:4px 4px 0 #111}
.qr-home-btn{min-height:58px;border-radius:20px;font-size:clamp(15px,4vw,20px);box-shadow:4px 4px 0 #111}.qr-home-btn .qr-icon{font-size:22px}
.footer{margin-top:9px;padding-bottom:2px;font-size:9px}

/* game screens: all four cards stay visible on a phone */
body[data-screen="employee"],body[data-screen="employeeLocked"]{overflow:hidden}
body[data-screen="employee"] .footer,body[data-screen="employeeLocked"] .footer{display:none}
#employee.active,#employeeLocked.active{height:calc(100dvh - max(8px,env(safe-area-inset-top)) - max(8px,env(safe-area-inset-bottom)) - 44px);display:flex;flex-direction:column;min-height:0}
#employee .screen-head,#employeeLocked .screen-head{margin-bottom:7px;flex:0 0 auto}
.screen-title{font-size:clamp(25px,6.6vw,38px);line-height:.9}
.screen-note{padding:5px 8px;font-size:9px;box-shadow:3px 3px 0 #111;border-radius:12px}
.job-banner{padding:8px 10px;border-radius:16px;margin-bottom:8px;font-size:14px;box-shadow:3px 3px 0 #111;flex:0 0 auto}
.job-banner .icon{font-size:20px}.job-banner small{font-size:8px;margin-bottom:2px}
#employee .cards,#employeeLocked .cards{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;flex:1;min-height:0;margin:0 0 8px}
#employee .card,#employeeLocked .card{min-height:0;height:100%;padding:10px 10px 9px;border-radius:18px;box-shadow:3px 3px 0 #111}
#employee .card .cat,#employeeLocked .card .cat{font-size:8px;margin-bottom:5px;line-height:1.05;color:#111!important}
#employee .card .trait,#employeeLocked .card .trait{font-size:clamp(15px,4.2vw,22px);line-height:.92;margin-bottom:7px;color:#111!important}
#employee .card .q,#employeeLocked .card .q{font-size:clamp(10px,2.9vw,13px);line-height:1.08;font-weight:750;color:#111!important;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
#employee .card:before,#employeeLocked .card:before{width:34px;height:34px;inset:auto 8px 8px auto;border-width:2px;opacity:.18}
.lock-badge{right:7px;top:7px;padding:3px 6px;font-size:7px;border-width:2px;background:#f2df75;color:#111!important}
#employee .actions,#employeeLocked .actions{position:static;flex:0 0 auto;margin:0;padding:0;background:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action{min-height:48px;font-size:14px;box-shadow:3px 3px 0 #111}

/* employer stays scrollable but less oversized */
.jobs-shell{padding:11px;border-radius:22px}
.search{min-height:46px;padding:9px 13px;font-size:14px;margin-bottom:8px;box-shadow:3px 3px 0 #111}
.filter-row{gap:7px;padding-bottom:8px}.filter-chip{padding:7px 10px;font-size:9px;box-shadow:3px 3px 0 #111}
.job-list{gap:8px;max-height:62dvh}.job{min-height:102px;padding:10px;border-radius:18px;box-shadow:3px 3px 0 #111}.job strong{font-size:17px;line-height:.98;color:#111!important}.job .jcat{font-size:9px;color:#111!important}.job-code{font-size:8px;padding:4px 6px;border-width:2px}
.locked-panel{padding:16px;border-radius:24px}.locked-panel .big{font-size:clamp(28px,7vw,46px)}.note{font-size:13px}

@media (max-width:740px){
  .topbar{flex-direction:row;align-items:center}
  .top-actions{width:auto;justify-content:flex-end}
  .role-grid,.menu-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .job-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .role{min-height:108px}
  .panel,.jobs-shell,.locked-panel{padding:11px}
  .screen-head{flex-direction:row;align-items:flex-start}
  .card{min-height:0}
}
@media (max-width:380px){
  .lang,.sound-btn,.install-btn{font-size:9px;padding:6px 8px;min-height:32px}
  .screen-title{font-size:24px}.screen-note{font-size:8px}
  .job-banner{font-size:12px;padding:7px 9px}
  #employee .cards,#employeeLocked .cards{gap:6px;margin-bottom:6px}
  #employee .card,#employeeLocked .card{padding:8px;border-radius:15px}
  #employee .card .trait,#employeeLocked .card .trait{font-size:14px;margin-bottom:5px}
  #employee .card .q,#employeeLocked .card .q{font-size:9.5px;-webkit-line-clamp:4}
  .action{min-height:44px;font-size:12px}
  .job-list{grid-template-columns:1fr 1fr}
  .job strong{font-size:15px}
}
@media (max-height:700px) and (max-width:740px){
  .topbar{margin-bottom:5px}.lang,.sound-btn,.install-btn{min-height:30px;padding:5px 8px}
  #employee.active,#employeeLocked.active{height:calc(100dvh - max(6px,env(safe-area-inset-top)) - max(6px,env(safe-area-inset-bottom)) - 36px)}
  .screen-title{font-size:22px}.screen-note{padding:4px 6px;font-size:8px}.job-banner{padding:6px 8px;margin-bottom:6px;font-size:11px}.job-banner .icon{font-size:16px}
  #employee .cards,#employeeLocked .cards{gap:5px;margin-bottom:5px}

window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;maybeShowInstall();});
function currentGameUrl(){const u=new URL(window.location.href);u.hash='';return u.toString();}
function openQr(){const url=currentGameUrl();$('qrUrl').textContent=url;$('qrImage').src='https://quickchart.io/qr?size=700&margin=2&text='+encodeURIComponent(url);$('qrModal').classList.add('open');document.body.style.overflow='hidden';}
function closeQr(){$('qrModal').classList.remove('open');document.body.style.overflow='';}
$('qrHomeBtn').onclick=()=>{beep(610,.05);openQr();};
$('qrCloseBtn').onclick=closeQr;
$('qrModal').onclick=e=>{if(e.target===$('qrModal'))closeQr();};
$('qrCopyBtn').onclick=async()=>{const url=currentGameUrl();try{await navigator.clipboard.writeText(url);toast((QR_LABELS[state.lang]||QR_LABELS.en).copied);}catch{toast(url);}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQr();});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'));
load();document.querySelectorAll('.role').forEach(x=>x.classList.toggle('selected',x.dataset.role===state.role));$('soundBtn').textContent=state.sound?'🔊':'🔇';applyLanguage();maybeShowInstall();
</script></body></html>
